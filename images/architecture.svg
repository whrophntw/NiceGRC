<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Nous Hermes configuration hierarchy</title>
  <desc id="fig-desc">config.yaml specifies three categories: MCP servers, platform toolsets, and skills. Tools invoke skills at runtime. Approvals and hooks govern every tool call.</desc>

  <defs>
    <marker id="arw" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#a8641c"/>
    </marker>
  </defs>

  <!-- font families and colours are kept separate: CSS classes win over
       presentation attributes, so colour is applied by class, never both ways -->
  <style>
    .lbl { font-family: "Times New Roman", Times, Georgia, serif; }
    .key { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .ink { fill: #12126d; }
    .amber { fill: #a8641c; }
    .paper { fill: #e9ded4; }
    .sub { font-size: 9.5px; }
    .title { font-size: 13.5px; }
    .item { font-size: 11.5px; }
    .cap { font-size: 10px; letter-spacing: 1.8px; }
    .box { fill: rgba(18,18,109,0.045); stroke: #12126d; stroke-width: 1.25; }
    .box-skill { fill: rgba(168,100,28,0.065); stroke: #a8641c; stroke-width: 1.25; }
    .wire { stroke: #12126d; stroke-width: 1.25; fill: none; }
    .rel { stroke: #a8641c; stroke-width: 1.25; fill: none; stroke-dasharray: 4 3; }
  </style>

  <text class="lbl cap ink" x="20" y="24" opacity="0.6">NOUS HERMES — CONFIGURATION HIERARCHY</text>

  <!-- root: the file itself -->
  <rect x="230" y="36" width="220" height="46" fill="#12126d"/>
  <text class="key paper" x="340" y="57" font-size="14" text-anchor="middle">config.yaml</text>
  <text class="key paper" x="340" y="72" font-size="9.5" text-anchor="middle" opacity="0.78">~/.hermes/config.yaml</text>

  <!-- trunk and bus -->
  <path class="wire" d="M340 82 V104"/>
  <path class="wire" d="M118 104 H560"/>
  <path class="wire" d="M118 104 V120 M339 104 V120 M560 104 V120"/>

  <!-- LEVEL 2: the three categories -->
  <rect class="box" x="20" y="120" width="196" height="56"/>
  <text class="lbl title ink" x="118" y="146" text-anchor="middle">MCP Servers</text>
  <text class="key ink" x="118" y="163" font-size="10" text-anchor="middle" opacity="0.7">mcp_servers:</text>

  <rect class="box" x="241" y="120" width="196" height="56"/>
  <text class="lbl title ink" x="339" y="146" text-anchor="middle">Tools / Toolsets</text>
  <text class="key ink" x="339" y="163" font-size="10" text-anchor="middle" opacity="0.7">platform_toolsets:</text>

  <rect class="box-skill" x="462" y="120" width="196" height="56"/>
  <text class="lbl title amber" x="560" y="146" text-anchor="middle">Skills</text>
  <text class="key amber" x="560" y="163" font-size="10" text-anchor="middle" opacity="0.75">skills/</text>

  <!-- stubs to level 3 -->
  <path class="wire" d="M118 176 V190 M339 176 V190 M560 176 V190"/>

  <!-- LEVEL 3: what each category holds -->
  <rect class="box" x="20" y="190" width="196" height="46"/>
  <text class="lbl item ink" x="118" y="212" text-anchor="middle">azure MCP server</text>
  <text class="lbl sub ink" x="118" y="227" text-anchor="middle" opacity="0.68">@3.0.0 · trust: untrusted</text>

  <rect class="box" x="20" y="246" width="196" height="46"/>
  <text class="lbl item ink" x="118" y="268" text-anchor="middle">azure_* tools</text>
  <text class="lbl sub ink" x="118" y="283" text-anchor="middle" opacity="0.68">read-only queries</text>

  <rect class="box" x="241" y="190" width="196" height="46"/>
  <text class="lbl item ink" x="339" y="212" text-anchor="middle">terminal · file · web</text>
  <text class="lbl sub ink" x="339" y="227" text-anchor="middle" opacity="0.68">browser · vision</text>

  <rect class="box" x="241" y="246" width="196" height="46"/>
  <text class="lbl item ink" x="339" y="268" text-anchor="middle">delegation · cron · memory</text>
  <text class="lbl sub ink" x="339" y="283" text-anchor="middle" opacity="0.68">enabled per platform</text>

  <rect class="box-skill" x="462" y="190" width="196" height="46"/>
  <text class="lbl item amber" x="560" y="212" text-anchor="middle">SKILL.md procedures</text>
  <text class="lbl sub amber" x="560" y="227" text-anchor="middle" opacity="0.68">custom + reusable</text>

  <rect class="box-skill" x="462" y="246" width="196" height="46"/>
  <text class="lbl item amber" x="560" y="268" text-anchor="middle">iso27001-control-evidence</text>
  <text class="lbl sub amber" x="560" y="283" text-anchor="middle" opacity="0.68">domain procedures</text>

  <!-- runtime relationship: tools invoke skills -->
  <path class="rel" d="M339 292 V314 H560 V292" marker-end="url(#arw)"/>
  <text class="lbl amber" x="449" y="330" font-size="9.5" text-anchor="middle">skills are invoked through tools</text>

  <!-- GOVERNANCE band: cross-cutting -->
  <text class="lbl cap ink" x="20" y="352" opacity="0.6">GOVERNANCE — APPLIES TO EVERY CALL</text>
  <rect x="20" y="362" width="638" height="64" fill="rgba(18,18,109,0.03)" stroke="#12126d" stroke-width="1.25"/>
  <text class="key ink" x="36" y="384" font-size="11">approvals:</text>
  <text class="lbl ink" x="36" y="401" font-size="11">dangerous commands gated</text>
  <text class="lbl ink" x="36" y="416" font-size="11">untrusted server writes ask first</text>
  <text class="key ink" x="350" y="384" font-size="11">hooks:</text>
  <text class="lbl ink" x="350" y="401" font-size="11">pre_tool_call / post_tool_call</text>
  <text class="lbl ink" x="350" y="416" font-size="11">→ audit_artifacts.py</text>

  <!-- legend -->
  <text class="lbl ink" x="20" y="452" font-size="10" opacity="0.65">Amber marks the custom skill layer · every tool call passes the governance band before execution.</text>
</svg>
